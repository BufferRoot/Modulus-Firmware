## Modulus Tab5 — Zig host scaffold (UI/HAL device backends land incrementally)
##
## Versions are pinned, and dependencies.lock is TRACKED. An unpinned solve
## against the live registry is what made this tree unbuildable on a clean
## clone (BufferRoot/Modulus-Firmware#2): components drifted to releases that
## assume a newer ESP-IDF than 6.0.1. Widen a constraint only after building.
dependencies:
  idf: '>=6.0,<7.0'
  espressif/m5stack_tab5: '*'
  espressif/esp_hosted: 2.11.4
  # Must match the esp_hosted host version; IDF 6.0.1 does NOT bundle this.
  espressif/esp_wifi_remote:
    override_path: ../components/espressif__esp_wifi_remote
  # 1.0.7 has an ignored top-level const in a pointer cast; GCC 15 treats it as
  # an error under this component's warnings-as-errors. Hold until upstream fixes.
  chmorgan/esp-audio-player: 1.0.7
  chmorgan/esp-file-iterator: 1.0.0
  espressif/bmi270_sensor: ^0.1.1
  espressif/esp-dsp: ^1.8.2
  # USB mass-storage class driver — mounts a plugged G-code stick at /usb for
  # the M-Panel USB Drive tool. usb_host_install() alone only enumerates; MSC
  # + FATFS is what makes files visible.
  espressif/usb_host_msc: ^1.1.0
  # Pinned. We do not use esp_lvgl_port (BSP_CONFIG_NO_GRAPHIC_LIB=1, LVGL is
  # not linked) but the BSP declares `espressif/esp_lvgl_port: ^2`, so the
  # solver still fetches and COMPILES it. 2.9.0 uses
  # esp_lcd_dpi_panel_event_callbacks_t.on_frame_buf_complete, which does not
  # exist in IDF 6.0.1 — adding any new dependency re-solves the graph and
  # breaks the build. Hold it at the last version that compiles here.
  espressif/esp_lvgl_port: '~2.4.0'
